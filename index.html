<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content=" SHUBHI Critical Care Hospital - Emergency, ICU and patient care services.">
<title>SHUBHI Critical Care Hospital</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--blue:#075985;--dark:#12324a;--green:#0d9b72;--light:#eef8fc}
body{font-family:Arial,sans-serif;color:var(--dark);line-height:1.6}
a{text-decoration:none;color:inherit}
.container{width:90%;max-width:1150px;margin:auto}
header{background:#fff;box-shadow:0 2px 12px #12324a15;position:sticky;top:0;z-index:10}
.nav{min-height:72px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.logo{font-size:19px;font-weight:800;color:var(--blue)}
.logo span{display:block;font-size:11px;color:#64748b;font-weight:500}
nav{display:flex;gap:18px;font-size:14px;font-weight:600}
.btn{display:inline-block;padding:12px 19px;border-radius:8px;background:var(--blue);color:white;font-weight:bold}
.btn.green{background:var(--green)}
.hero{background:linear-gradient(90deg,#e9f7ff 0%,#e9f7ffeb 45%,#e9f7ff20 100%),url('https://images.unsplash.com/photo-1587351021759-3e566b6af7cc?auto=format&fit=crop&w=1600&q=85') center/cover;padding:85px 0}
.hero-content{max-width:570px}
.eyebrow{color:var(--green);font-weight:bold;letter-spacing:1px}
h1{font-size:clamp(34px,5vw,54px);line-height:1.12;margin:12px 0}
.hero p{font-size:17px;margin-bottom:24px}
.actions{display:flex;flex-wrap:wrap;gap:12px}
section{padding:58px 0}
.section-title{text-align:center;margin-bottom:30px}
.section-title h2{font-size:30px;color:var(--blue)}
.section-title p{color:#64748b}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-top:-1px}
.feature{padding:22px 10px;text-align:center;background:white;border-radius:12px;box-shadow:0 4px 20px #12324a0c}
.feature strong{display:block;color:var(--blue);font-size:17px}
.feature span{font-size:13px;color:#64748b}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{border:1px solid #e1edf3;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 5px 20px #12324a0a}
.card img{width:100%;height:205px;object-fit:cover;display:block}
.card-body{padding:20px}
.card h3{color:var(--blue);margin-bottom:8px}
.card p{color:#64748b;font-size:14px;margin-bottom:15px}
.light{background:var(--light)}
.about{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:35px}
.about img{width:100%;height:350px;object-fit:cover;border-radius:16px}
.about h2{font-size:32px;color:var(--blue);margin-bottom:14px}
.about p{margin-bottom:18px;color:#526779}
.checks{padding-left:20px;margin-bottom:22px}
.checks li{margin:8px 0}
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:25px}
.contact-card{padding:25px;background:white;border-radius:14px}
.contact-card p{margin:12px 0;overflow-wrap:anywhere}
form{display:grid;gap:12px}
input,textarea{width:100%;padding:13px;border:1px solid #cbdde6;border-radius:7px;font:inherit}
textarea{min-height:110px;resize:vertical}
button{border:0;cursor:pointer;font:inherit}
footer{background:#092f49;color:white;padding:28px 0;text-align:center}
footer p{font-size:13px;color:#d3e5ef;margin:6px}
.whatsapp{position:fixed;right:18px;bottom:18px;background:#16a34a;color:white;border-radius:50px;padding:14px 18px;font-weight:bold;box-shadow:0 5px 20px #0002;z-index:20}
@media(max-width:800px){
 .nav{padding:13px 0;align-items:flex-start;flex-direction:column}
 nav{gap:12px;flex-wrap:wrap;font-size:12px}
 .hero{padding:65px 0;background-position:60% center}
 .features{grid-template-columns:repeat(2,1fr)}
 .grid{grid-template-columns:1fr}
 .card img{height:220px}
 .about,.contact-grid{grid-template-columns:1fr}
 .about img{height:260px}
 section{padding:42px 0}
 .section-title h2{font-size:26px}
}
.status-card {
  max-width: 600px;
  margin: 20px auto;
  padding: 24px;
  background: white;
  border-radius: 14px;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
}

.pending {
  color: #b77900;
}
